services:
  - type: web
    name: edutimes-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    # Health check — Render pings /api/health every 30s.
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: RATE_LIMIT_GLOBAL_MAX
        value: 2500
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
